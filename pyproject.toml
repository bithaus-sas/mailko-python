[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mailko"
dynamic = ["version"]
description = "Librería oficial de Mailko para Python: la API /v1, la verificación de webhooks y un backend de correo para Django."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bithaus SAS" }]
keywords = ["mailko", "email", "transactional", "ses", "django", "webhooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
django = ["Django>=4.2"]
dev = ["Django>=4.2", "pytest>=8", "responses>=0.25", "ruff>=0.6", "build>=1.2"]

[project.urls]
Homepage = "https://mailko.co"
Documentation = "https://github.com/bithaus-sas/mailko-python#readme"
Source = "https://github.com/bithaus-sas/mailko-python"
Changelog = "https://github.com/bithaus-sas/mailko-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/mailko/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mailko"]

[tool.hatch.build.targets.sdist]
include = ["src/mailko", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "Q", "N"]

[tool.ruff.lint.isort]
known-first-party = ["mailko"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
